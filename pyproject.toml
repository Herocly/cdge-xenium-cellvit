[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdge-xenium-cellvit"
version = "0.1.0"
description = "Xenium molecular labels to CellViT research pipeline"
requires-python = ">=3.10,<3.12"
dependencies = ["PyYAML==6.0.2"]

[project.scripts]
cdge-pipeline = "integrated_pipeline.cli:main"

[tool.setuptools]
packages = ["integrated_pipeline"]
