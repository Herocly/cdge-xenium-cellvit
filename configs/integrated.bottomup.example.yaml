# Teacher Bottom-up comparison arm. Use the SAME sample/cohort split and
# CellViT settings as integrated.example.yaml; change only the label source
# and experiment_id. The labeled h5ad must be generated by a documented
# original CDGE Bottom-up run on these same HEST samples.
experiment_id: hest_comparison_bottomup
output_root: ../runs_integrated
hest_dir: /path/to/hest_data
cdge_root: ../vendor/CDGE
image_python: ../envs/image/.venv/bin/python
analysis_python: ../envs/analysis/.venv/bin/python
cnv_python: ../envs/cnv/.venv/bin/python
cellvit_python: ../envs/cellvit/.venv/bin/python
patch_size: 256
min_csv_match_fraction: 0.9
samples:
  - sample_id: TENX_SAMPLE_A
    split: train
    cohort: cohort_A
    organ: Breast
    teacher_labeled_h5ad: /path/to/hest_data/proc_adata/TENX_SAMPLE_A_bottomup_cellmarker_neoplastic.h5ad
  - sample_id: TENX_SAMPLE_B
    split: val
    cohort: cohort_B
    organ: Breast
    teacher_labeled_h5ad: /path/to/hest_data/proc_adata/TENX_SAMPLE_B_bottomup_cellmarker_neoplastic.h5ad
cellvit:
  epochs: 130
  batch_size: 16
  learning_rate: 0.0003
  random_seed: 19
  scheduler_gamma: 0.85
  unfreeze_epoch: 25
  early_stopping_patience: 20
  device: cuda
  external_test_dataset: /path/to/prepared_pannuke
